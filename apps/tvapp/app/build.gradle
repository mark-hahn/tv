apply plugin: 'com.android.application'

android {
  namespace 'com.hahnca.tvapp'
  compileSdk 35

  defaultConfig {
    applicationId 'com.hahnca.tvapp'
    minSdkVersion 21
    targetSdkVersion 34
    versionCode 1
    versionName '1.0.0'
  }

  signingConfigs {
    debug {
      storeFile file('debug.keystore')
      storePassword 'android'
      keyAlias 'androiddebugkey'
      keyPassword 'android'
    }
  }

  buildTypes {
    release {
      signingConfig signingConfigs.debug
      minifyEnabled false
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  // Server side of the tvapprc socket.
  implementation 'org.java-websocket:Java-WebSocket:1.5.7'
  // In-app playback of episode files (VideoPlayer). 1.8 is the last line that
  // takes minSdk 21 and compileSdk 35.
  implementation 'androidx.media3:media3-exoplayer:1.8.1'
  implementation 'androidx.media3:media3-ui:1.8.1'
}
