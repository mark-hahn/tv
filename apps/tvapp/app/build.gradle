apply plugin: 'com.android.application'

android {
  namespace 'com.hahnca.tvapp'
  compileSdk 35

  defaultConfig {
    applicationId 'com.hahnca.tvapp'
    minSdkVersion 21
    targetSdkVersion 34
    versionCode 1
    versionName '1.0.0'
  }

  signingConfigs {
    debug {
      storeFile file('debug.keystore')
      storePassword 'android'
      keyAlias 'androiddebugkey'
      keyPassword 'android'
    }
  }

  buildTypes {
    release {
      signingConfig signingConfigs.debug
      minifyEnabled false
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
